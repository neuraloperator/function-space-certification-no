[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lean-no"
version = "0.1.0"
description = "Certified grid and function-space bounds for Fourier neural operators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "neuraloperator>=2.0.0",
    "numpy>=2.4.4",
    "python-flint>=0.9.0",
    "scipy>=1.17.0",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# torch-harmonics>=0.9 has Linux-only PyPI wheels; 0.8.0 is the last macOS-compatible release.
harmonics = [
    "torch-harmonics==0.8.0",
]
sfno = [
    "earth2studio[sfno] @ git+https://github.com/NVIDIA/earth2studio.git@e79aa3d45765d8516ea5911871bedbd4ccae0321 ; sys_platform == 'linux' and python_version == '3.12'",
    "makani @ git+https://github.com/NVIDIA/makani.git@b38fcb2799d7dbc146fa60459f3f9823394a8bf1 ; sys_platform == 'linux' and python_version == '3.12'",
    "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@a632ca748a12bd9f74dbc1e00653317810991f74 ; sys_platform == 'linux' and python_version == '3.12'",
    "torch==2.9.1 ; sys_platform == 'linux' and python_version == '3.12'",
    "torchvision==0.24.1 ; sys_platform == 'linux' and python_version == '3.12'",
    "moviepy<2 ; sys_platform == 'linux' and python_version == '3.12'",
    # PhysicsNeMo 2.0 uses warp.context, removed in Warp 1.13.
    "warp-lang>=1.12,<1.13 ; sys_platform == 'linux' and python_version == '3.12'",
    "setuptools ; sys_platform == 'linux' and python_version == '3.12'",
    "setuptools-scm ; sys_platform == 'linux' and python_version == '3.12'",
    "ninja ; sys_platform == 'linux' and python_version == '3.12'",
]

[tool.uv]
conflicts = [[{ group = "harmonics" }, { group = "sfno" }]]
# Compile against the runtime PyTorch, avoiding the prebuilt extension ABI mismatch.
no-build-isolation-package = ["torch-harmonics"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["lean_no"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = ["lean_no/**/*.py", "scripts/**/*.py", "training/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
